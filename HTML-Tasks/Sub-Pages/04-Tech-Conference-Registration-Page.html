<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Now</title>
</head>
<body>
    <form action="/server">
        <fieldset>
            <legend><strong>Tech Conference Registration</strong></legend>
            <br>
            <label for="name">Full Name: </label>
            <input type="text" name="name" id="name" required><br><br>
            <label for="email">Email Address: </label>
            <input type="email" name="email" id="email" required><br><br>
            <label for="college">College/University Name: </label>
            <input type="text" id="college" placeholder="type here..." required><br><br>
            <label for="c-sem">Current semester: </label>
            <input type="text" id="c-sem" placeholder="type here..." required><br><br>
            <label for="interest">Area of Interest: </label>
            <input type="text" name="interest" id="interest"><br><br>

            <button>SUBMIT</button>
            <button>Clear Form</button>
        </fieldset>
    </form>
</body>
</html>
